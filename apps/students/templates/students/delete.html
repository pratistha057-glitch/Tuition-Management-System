{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student | Tuition Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/students.css' %}">
</head>
<body>
<div class="container">
    <div class="delete-container">
        <div class="delete-card">

            <header class="form-header">
                <h2>Delete Student</h2>
                <a href="{% url 'student-list' %}" class="back-link">
                    <i class="bi bi-arrow-left"></i> Back to List
                </a>
            </header>

            <main class="delete-body">
                <div class="delete-icon">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>

                <h3 class="delete-title">Are you sure?</h3>

                <p class="delete-message">
                    You are about to delete the following student record:
                </p>

                <p class="delete-student-name">
                    {{ object.user.username }}
                </p>

                <p class="text-muted small">
                    Student ID: {{ object.student_id }}
                </p>

                <p class="delete-message">
                    This action cannot be undone.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <div class="delete-actions">
                        <a href="{% url 'student-list' %}" class="btn-form-cancel">
                            <i class="bi bi-x-circle me-1"></i>
                            Cancel
                        </a>

                        <button type="submit" class="btn-danger-custom">
                            <i class="bi bi-trash me-1"></i>
                            Delete Student
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
