{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student | Tuition Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/students.css' %}">
</head>
<body>
<div class="container form-page">
    <div class="page-title-section"><h1>Delete Student</h1><p>Tuition Management System Records</p></div>
    <div class="main-card form-content">
        <p>Are you sure you want to delete <strong>{{ object.student_id }} — {{ object.user.username }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'student-list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
